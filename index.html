<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    *{
      padding: 0;
      margin: 0;
    box-sizing: border-box;
      }
      body{
        background-color: rgb(19, 20, 20);
      }

    .calcy{
      color: white;
      
      
      margin: 200px 400px 0px 600px;
      border: 2px solid black;
      height: 400px;
      width: 300px;
      background-color: rgba(34, 33, 33, 0.971);
      
      border-radius: 20px;
      box-shadow: -3px -3px 3px 3px grey,3px 3px 3px 3px grey;
    }
    .screen{
      height: 60px;
      width: 260px;
      /* border: 2px solid rgb(72, 69, 69); */
      margin-bottom: 20px ;
      padding: 20px;
    }
    .screen input{
      height: 50px;
      width: 250px;
      text-align: end;
      margin-bottom: 2px;
      margin:5px  ;
      font-size: 20px;
      font-weight: bold;
      
      border-radius: 10px;
      
    }
    .screen input:hover{
      
      border: 2px solid rgb(6, 225, 225);
      transform: translateY(-2px);
      
    }
    .row{
      padding: 20px;
      height: 70px;
      width: 280px;
      margin: 5px;
      /* border: 2px solid rgb(72, 69, 69); */
      display: flex;
      justify-content: center;
    }
    button{
      height: 20px;
      width: 60px;
      margin: 2px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: bold;
      box-shadow: 2px 2px 2px  grey;
    }
    button:hover{
      
      border: 2px solid rgb(6, 225, 225);
      transform: translateY(-2px);
      
    }
    .btn1{
      background-color: orange;

    }
    .btn2{
      background-color: green;
    }

  </style>
</head>

<body>
  <div class="calcy">
    <div class="screen">
      <input type="text" id="input" placeholder="0">
    </div>
    <div  class="row">
      <button id="btn" >7</button>
      <button id="btn" >8</button>
      <button id="btn" >9</button>
      <button id="btn" class="btn2" >DEL</button>
      <button id="btn"  class="btn2">AC</button>

    </div>

    <div class="row">
      <button id="btn" >4</button>
      <button id="btn" >5</button>
      <button id="btn" >6</button>
      <button id="btn" >x</button>
       <button id="btn" >/</button>
    </div>

    <div class="row">
      <button id="btn" >1</button>
      <button id="btn" >2</button>
      <button id="btn" >3</button>
      <button id="btn" >+</button>
       <button id="btn" >-</button>
    </div>

    <div class="row">
      <button id="btn" >0</button>
      <button id="btn" >00</button>
      <button id="btn" >.</button>
      <button id="btn" >%</button>
      <button id="btn" class="btn1" >=</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const button = document.querySelectorAll('[id="btn"]');
    let string = "";
    let arr = Array.from(button);
    arr.forEach((button)=>{
      button.addEventListener("click",(e)=>{
       if (e.target.innerHTML == "=") {
      string = eval(string.replace(/x/g, "*"));
      input.value = string;
    }
          
        
        else if(e.target.innerHTML == "AC"){
          string = "";
          input.value = string;
        }
        else if(e.target.innerHTML == "DEL"){
          string = string.substring(0,string.length -1);
          input.value = string;
        }
        else{
          string = string + e.target.innerHTML;
          input.value = string;

        }
      })
    })

  </script>
</body>


    
 

</html>
